name: Publish Personal Trip Planner
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check && npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser && npm run test:files && npm run test:a11y
      - name: Prepare only reviewed static assets
        run: |
          mkdir -p _site/assets _site/vendor
          cp index.html styles.css app.js model.js attachments.js _site/
          cp assets/compass.svg _site/assets/
          cp vendor/pdf.mjs vendor/pdf.worker.mjs vendor/pdfjs-LICENSE.txt _site/vendor/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
